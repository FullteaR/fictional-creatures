services:
  model-downloader:
    image: python:3.11-slim
    volumes:
      - ./models:/models
    environment:
      - HF_HUB_ENABLE_HF_TRANSFER=1
    command: >
      sh -c "
        if ls /models/*UD-Q4_K_XL*.gguf 1>/dev/null 2>&1; then
          echo 'Model already downloaded, skipping.';
        else
          pip install -q huggingface_hub hf_transfer &&
          hf download unsloth/Qwen3.5-35B-A3B-GGUF
            --local-dir /models
            --include '*UD-Q4_K_XL*';
        fi
      "
    restart: "no"

  llama-server:
    build:
      context: .
      dockerfile: Dockerfile.llama-server
    volumes:
      - ./models:/models
    ports:
      - "8080:8080"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "llama-server
        --model $(ls /models/*UD-Q4_K_XL*.gguf | sort | head -1)
        --ctx-size 4096
        --n-gpu-layers 99
        --host 0.0.0.0
        --port 8080"
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - count: all
              capabilities: [gpu]

  app:
    build: .
    container_name: endemic
    shm_size: '128g'
    mem_limit: '110g'
    volumes:
      - ./src:/mnt
    depends_on:
      llama-server:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - count: all
              capabilities: [gpu]
