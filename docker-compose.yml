services:
  model-downloader:
    build:
      context: .
      dockerfile: Dockerfile.model-downloader
    volumes:
      - ./models:/models
    restart: "no"

  llama-server:
    build:
      context: .
      dockerfile: Dockerfile.llama-server
    volumes:
      - ./models:/models
    ports:
      - "8080:8080"
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - count: all
              capabilities: [gpu]

  app:
    build: .
    container_name: endemic
    shm_size: '128g'
    mem_limit: '110g'
    volumes:
      - ./src:/mnt
    depends_on:
      llama-server:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - count: all
              capabilities: [gpu]
