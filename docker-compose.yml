services:
  model-downloader:
    build:
      context: .
      dockerfile: Dockerfile.model-downloader
    container_name: model-downloader
    volumes:
      - ./models:/models

  llama-server:
    build:
      context: .
      dockerfile: Dockerfile.llama-server
    container_name: llama-server
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    volumes:
      - ./models:/models
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - count: all
              capabilities: [gpu]

  app:
    build: .
    container_name: endemic
    shm_size: '128g'
    mem_limit: '110g'
    ports:
      - "28080:8888"
    volumes:
      - ./src:/mnt
    environment:
      - LLAMA_SERVER_URL=${LLAMA_SERVER_URL:-http://llama-server:8080/v1}
    depends_on:
      - llama-server
    deploy:
      resources:
        reservations:
          devices:
            - count: all
              capabilities: [gpu]
