services:
  model-downloader:
    build:
      context: .
      dockerfile: Dockerfile.model-downloader
    container_name: model-downloader
    volumes:
      - ./models:/models

  llama-server:
    build:
      context: .
      dockerfile: Dockerfile.llama-server
    container_name: llama-server
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    volumes:
      - ./models:/models
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - count: all
              capabilities: [gpu]

  comfyui:
    build:
      context: .
      dockerfile: Dockerfile.comfyui
    container_name: comfyui
    ports:
      - "8188:8188"
    volumes:
      - ./models/comfyui:/comfyui/models
    deploy:
      resources:
        reservations:
          devices:
            - count: all
              capabilities: [gpu]

  app:
    build: .
    container_name: endemic
    ports:
      - "28080:8888"
    volumes:
      - ./src:/mnt
    environment:
      - LLAMA_SERVER_URL=${LLAMA_SERVER_URL:-http://llama-server:8080/v1}
      - COMFYUI_URL=${COMFYUI_URL:-http://comfyui:8188}
    depends_on:
      - llama-server
      - comfyui
