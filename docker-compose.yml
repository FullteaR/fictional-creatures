services:
  model-downloader:
    build:
      context: .
      dockerfile: Dockerfile.model-downloader
    container_name: model-downloader
    volumes:
      - ./models:/models

  llama-server:
    build:
      context: .
      dockerfile: Dockerfile.llama-server
    container_name: llama-server
    # 落ちたら復帰させる。llama-server が死ぬとノートブックの以降のセルが
    # 全部 connection error になり、手で up し直すまで直らないため。
    restart: unless-stopped
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    volumes:
      - ./models:/models
    ports:
      - "8080:8080"
    # /health は起動直後 503、モデルのロードが終わると 200 を返す
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s
    deploy:
      resources:
        reservations:
          devices:
            - count: all
              capabilities: [gpu]

  comfyui:
    build:
      context: .
      dockerfile: Dockerfile.comfyui
    container_name: comfyui
    # llama-server と同様、落ちたらノートブックが画像生成で止まるので復帰させる。
    restart: unless-stopped
    ports:
      - "8188:8188"
    volumes:
      - ./models/comfyui:/comfyui/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8188/system_stats', timeout=5)"]
      interval: 5s
      timeout: 8s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - count: all
              capabilities: [gpu]

  app:
    build: .
    container_name: endemic
    ports:
      - "28080:8888"
    volumes:
      - ./src:/mnt
    environment:
      - LLAMA_SERVER_URL=${LLAMA_SERVER_URL:-http://llama-server:8080/v1}
      - COMFYUI_URL=${COMFYUI_URL:-http://comfyui:8188}
    # 素の depends_on はコンテナの起動しか待たない。llama-server は 12GB の
    # モデルロードに ~36s、comfyui は ~14s かかるので、その間にノートブックを
    # 実行すると connection error になる。healthy になるまで待たせる。
    depends_on:
      llama-server:
        condition: service_healthy
      comfyui:
        condition: service_healthy
