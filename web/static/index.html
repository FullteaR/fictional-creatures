<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>架空固有種 観察記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400&family=Shippori+Mincho:wght@400;800&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>架空固有種 観察記録</h1>
  <button id="go" type="button">探しに行く</button>
  <p id="note"></p>
  <div id="book"></div>
  <div id="controls" hidden>
    <nav id="pager" hidden>
      <button id="back" type="button" aria-label="前の記録">‹</button>
      <span id="count"></span>
      <button id="forward" type="button" aria-label="次の記録">›</button>
    </nav>
    <p id="keep"><a id="save" href="" download>↓ 保存</a></p>
  </div>
  <footer>
    <a href="https://github.com/FullteaR/fictional-creatures" target="_blank" rel="noopener">github.com/FullteaR/fictional-creatures</a>
  </footer>
</main>
<script src="/static/app.js"></script>
</body>
</html>
